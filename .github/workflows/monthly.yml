name: Pipeline mensual · Sector Eléctrico + Excel refresh

# MEM Anexo Informe Desempeño (días 1 y 15 del mes a las 13:00 UTC = 09:00 RD).
# Idempotente — se puede correr múltiples veces sin duplicar.

on:
  schedule:
    - cron: "0 13 1,15 * *"
  workflow_dispatch:

jobs:
  electrico:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: dashboard-min/requirements.txt

      - run: pip install -r dashboard-min/requirements.txt

      - name: Pipeline Sector Eléctrico (MEM)
        working-directory: dashboard-min
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m pipelines.sector_electrico.run

      - name: Regenerar Excel
        working-directory: dashboard-min
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/build_dashboard_excel.py

      - name: Commit Excel actualizado → Vercel auto-deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard-web/public/dashboard_completo.xlsx
          if git diff --staged --quiet; then
            echo "Sin cambios en el Excel"
          else
            git commit -m "chore(data): refresh sector eléctrico $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do git push && break; sleep $((i*10)); git pull --rebase -X theirs || { git rebase --abort; git pull --no-rebase -X ours; }; done
          fi

      - name: Subir indicadores_energeticos.xlsx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indicadores_energeticos
          path: dashboard-min/data/excel_output/indicadores_energeticos.xlsx
          if-no-files-found: warn
