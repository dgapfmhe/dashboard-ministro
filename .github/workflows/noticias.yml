name: Noticias · scraper diario + sentimiento + ISEC/ISEP

# 06:00 RD (10:00 UTC), todos los días:
#   1) scrapea t-1 (categorías + barrido general) y re-barre t-3 (lo publicado tarde)
#   2) backfill de categorías nuevas (si las hay)
#   3) cola de textos: URL original + texto completo
#   4) sentimiento (modelos activos) y 5) índices → Supabase
# Los datos (Parquet con texto íntegro) se guardan en el repo PRIVADO
# dgapfmhe/dashboard-noticias, nunca en este repo público.

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dia:
        description: "Día a scrapear (AAAA-MM-DD). Vacío = ayer (hora RD)"
        required: false
      minutos_textos:
        description: "Presupuesto (min) para la cola de textos"
        required: false
        default: "120"
      indices_completo:
        description: "Re-subir todos los índices (tras cambiar categorías/modelos)"
        type: boolean
        default: false
      omitir_scraper:
        description: "Saltar el scraper (solo textos, sentimiento, índices y pronósticos)"
        type: boolean
        default: false

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: read
    env:
      NOTICIAS_DIR: ${{ github.workspace }}/datos
      HF_DATASETS_DISABLE_PROGRESS_BARS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Repo privado de datos
        uses: actions/checkout@v4
        with:
          repository: dgapfmhe/dashboard-noticias
          ssh-key: ${{ secrets.NOTICIAS_DEPLOY_KEY }}
          path: datos

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: dashboard-min/pipelines/noticias/requirements.txt

      - name: Caché de modelos HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('dashboard-min/pipelines/noticias/config/modelos.yaml') }}
          restore-keys: hf-

      - name: Dependencias
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r dashboard-min/pipelines/noticias/requirements.txt

      - name: 1 · Scraper diario (t-1 + re-barrido t-3 + barrido general)
        id: scraper
        if: ${{ !inputs.omitir_scraper }}
        continue-on-error: true
        working-directory: dashboard-min
        run: |
          ARGS=""
          if [ -n "${{ inputs.dia }}" ]; then ARGS="--dia ${{ inputs.dia }}"; fi
          python -m pipelines.noticias.scraper diario $ARGS

      - name: Checkpoint datos
        if: always()
        run: bash dashboard-min/pipelines/noticias/guardar_datos.sh datos "scraper diario $(date -u +%F)"

      - name: 2 · Backfill de categorías nuevas
        if: ${{ !inputs.omitir_scraper }}
        continue-on-error: true
        working-directory: dashboard-min
        run: python -m pipelines.noticias.scraper categorias-nuevas --minutos 30

      - name: 2b · Relleno de huecos sin noticias (semana a semana, reanudable)
        if: ${{ !inputs.omitir_scraper }}
        continue-on-error: true
        working-directory: dashboard-min
        run: python -m pipelines.noticias.scraper rellenar --minutos 60

      - name: 3 · Textos completos (cola)
        continue-on-error: true
        working-directory: dashboard-min
        run: python -m pipelines.noticias.scraper textos --minutos ${{ inputs.minutos_textos || '120' }}

      - name: Checkpoint datos
        if: always()
        run: bash dashboard-min/pipelines/noticias/guardar_datos.sh datos "textos $(date -u +%F)"

      - name: 4 · Sentimiento
        continue-on-error: true
        working-directory: dashboard-min
        run: python -m pipelines.noticias.sentimiento --minutos 50

      - name: 5 · Índices → Supabase
        working-directory: dashboard-min
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.indices_completo }}" = "true" ]; then ARGS="--completo"; fi
          python -m pipelines.noticias.indices $ARGS

      - name: 6 · Pronósticos oficiales (laboratorio) → Supabase
        if: always()
        continue-on-error: true
        working-directory: dashboard-min
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m pipelines.noticias.pronosticos

      - name: Guardar datos
        if: always()
        run: bash dashboard-min/pipelines/noticias/guardar_datos.sh datos "sentimiento + indices $(date -u +%F)"

      - name: Resumen
        if: always()
        working-directory: dashboard-min
        run: python -m pipelines.noticias.scraper estado | tee -a "$GITHUB_STEP_SUMMARY"
