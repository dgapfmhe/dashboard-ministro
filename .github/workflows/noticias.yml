name: Noticias · ciclo autónomo (scraper diario, relleno, textos, sentimiento, ISEC/ISEP)

# Corre cada 3 horas y hace lo pendiente por prioridad (pipelines/noticias/ciclo.py):
#   1) diario t-1 (desde las 05:00 RD; recupera días atrasados)  2) categorías nuevas
#   3) auditoría de cobertura  4) relleno profundo de huecos  5) textos completos
#   6) profundizar histórico  7) sentimiento  8) índices + pronósticos → Supabase
# Cada corrida es idéntica ("haz lo que falte"): si GitHub cancela o retrasa una,
# la siguiente la cubre. Checkpoint al repo privado de datos tras cada paso.
# Los datos (Parquet con texto íntegro) viven en el repo PRIVADO dgapfmhe/dashboard-noticias.

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      minutos:
        description: "Presupuesto de trabajo (min)"
        required: false
        default: "165"
      dia:
        description: "Forzar scraper diario de un día (AAAA-MM-DD). Vacío = automático"
        required: false
      indices_completo:
        description: "Re-subir todos los índices (tras cambiar categorías/modelos)"
        type: boolean
        default: false

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 205
    permissions:
      contents: read
    env:
      NOTICIAS_DIR: ${{ github.workspace }}/datos
      HF_DATASETS_DISABLE_PROGRESS_BARS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Repo privado de datos
        uses: actions/checkout@v4
        with:
          repository: dgapfmhe/dashboard-noticias
          ssh-key: ${{ secrets.NOTICIAS_DEPLOY_KEY }}
          path: datos

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: dashboard-min/pipelines/noticias/requirements.txt

      - name: Caché de modelos HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('dashboard-min/pipelines/noticias/config/modelos.yaml') }}
          restore-keys: hf-

      - name: Dependencias
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r dashboard-min/pipelines/noticias/requirements.txt

      - name: Ciclo
        working-directory: dashboard-min
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS="--minutos ${{ inputs.minutos || '165' }}"
          if [ -n "${{ inputs.dia }}" ]; then ARGS="$ARGS --dia ${{ inputs.dia }}"; fi
          if [ "${{ inputs.indices_completo }}" = "true" ]; then ARGS="$ARGS --indices-completo"; fi
          python -m pipelines.noticias.ciclo $ARGS

      - name: Guardar datos (por si el ciclo se cortó)
        if: always()
        run: bash dashboard-min/pipelines/noticias/guardar_datos.sh datos "ciclo $(date -u +%F-%H)"

      - name: Resumen
        if: always()
        working-directory: dashboard-min
        run: |
          python -m pipelines.noticias.scraper estado | tee -a "$GITHUB_STEP_SUMMARY"
          python -m pipelines.noticias.relleno estado | tee -a "$GITHUB_STEP_SUMMARY"
