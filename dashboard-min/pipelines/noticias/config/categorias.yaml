version: 1
notas: 'Fuente de verdad de las categorías. Las de origen ''investigacion'' están congeladas (no editar sus queries: rompen la comparabilidad del ISEC). Para agregar una categoría nueva usa el formulario de issue ''Nueva categoría de noticias'' o agrega un bloque con origen: usuario.'
sectores:
- id: GEN
  nombre: General
  nombre_investigacion: General · Resumen Sectorial
  origen: investigacion
  congelada: true
  activa_desde: '2016-01-01'
  subcategorias:
  - id: GEN.inflacion_y_precios
    nombre: Inflacion y Precios
    queries:
    - '("indice de precios al consumidor" OR IPC OR inflacion OR "inflacion interanual" OR "inflacion subyacente" OR "costo de vida" OR "canasta basica" OR "canasta familiar") AND "Republica Dominicana"'
  - id: GEN.actividad_y_crecimiento
    nombre: Actividad y Crecimiento
    queries:
    - '(PIB OR "producto interno bruto" OR IMAE OR "actividad economica" OR "crecimiento economico" OR "cuentas nacionales") AND "Republica Dominicana"'
  - id: GEN.politica_monetaria
    nombre: Politica Monetaria
    queries:
    - '("Banco Central" OR BCRD OR "junta monetaria") AND ("tasa de politica monetaria" OR "tasa de referencia" OR "politica monetaria" OR "meta de inflacion" OR "encaje legal") AND "Republica Dominicana"'
  - id: GEN.tipo_de_cambio
    nombre: Tipo de Cambio
    queries:
    - '(dolar OR "tipo de cambio" OR "tasa de cambio" OR "mercado cambiario" OR "reservas internacionales" OR depreciacion) AND "Republica Dominicana"'
  - id: GEN.remesas
    nombre: Remesas
    queries:
    - '(remesas OR "remesas familiares" OR "envios de dinero" OR remesadoras) AND "Republica Dominicana"'
  - id: GEN.comercio_exterior
    nombre: Comercio Exterior
    queries:
    - '(exportaciones OR importaciones OR "balanza comercial" OR "cuenta corriente" OR aranceles OR "balanza de pagos") AND "Republica Dominicana"'
  - id: GEN.inversion_extranjera
    nombre: Inversion Extranjera
    queries:
    - '("inversion extranjera directa" OR IED OR "inversion privada" OR "atraccion de inversiones" OR "clima de inversion") AND "Republica Dominicana"'
  - id: GEN.finanzas_publicas
    nombre: Finanzas Publicas
    queries:
    - '("deficit fiscal" OR "deuda publica" OR "presupuesto nacional" OR recaudacion OR DGII OR "Ministerio de Hacienda" OR "gasto publico") AND "Republica Dominicana"'
  - id: GEN.empleo
    nombre: Empleo
    queries:
    - '(empleo OR desempleo OR "mercado laboral" OR "salario minimo" OR informalidad OR cotizantes OR "Ministerio de Trabajo") AND "Republica Dominicana"'
  - id: GEN.sector_financiero_y_credito
    nombre: Sector Financiero y Credito
    queries:
    - '("sistema financiero" OR banca OR bancos OR credito OR "cartera de credito" OR morosidad OR "Superintendencia de Bancos") AND "Republica Dominicana"'
