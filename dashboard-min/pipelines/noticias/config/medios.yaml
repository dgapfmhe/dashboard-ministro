# Barrido general ("capturar todo"): por cada medio dominicano se pide a Google
# News todo lo publicado el día (site:dominio). Google entrega como máximo 100
# notas por consulta; si un medio SATURA (100), se parte por sus secciones.
# Agregar/quitar medios aquí. `secciones` = rutas del sitio (site:dominio/seccion).
#
# `rss`: feeds propios del medio. Solo sirven para obtener la URL directa de las
# notas más recientes sin decodificar el enlace de Google (ahorra peticiones).

medios:
  - dominio: diariolibre.com
    secciones: [economia, politica, actualidad, mundo, deportes, revista, opinion, usa, planeta, ciencia-y-tecnologia]
    rss: [https://www.diariolibre.com/rss/portada.xml, https://www.diariolibre.com/rss/economia.xml]
  - dominio: listindiario.com
    secciones: [economia, la-republica, las-mundiales, el-deporte, entretenimiento, puntos-de-vista, la-vida, las-sociales]
  - dominio: acento.com.do
    secciones: [economia, politica, actualidad, internacional, deportes, opinion, cultura, tecnologia]
  - dominio: hoy.com.do
    secciones: [economia, panorama, opiniones, alegria, deportes, mundiales]
  - dominio: elcaribe.com.do
    secciones: [panorama, gente, deportes, opiniones, economia]
  - dominio: eldinero.com.do
    rss: [https://eldinero.com.do/feed/]
