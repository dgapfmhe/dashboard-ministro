name: Pipeline semanal · Macro BCRD completo + Excel auto-commit

# Corre TODOS los parsers BCRD + externos.
# Regenera dashboard_completo.xlsx con charts nativos.
# Commit del Excel actualizado → Vercel auto-deploya.
# Lunes 14:00 UTC (10:00 RD).

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write   # para commit + push del Excel regenerado
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: dashboard-min/requirements.txt

      - name: Instalar dependencias Python
        working-directory: dashboard-min
        run: pip install -r requirements.txt

      - name: Sincronizar catálogo
        working-directory: dashboard-min
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sql/upsert_catalogo_supabase.py

      - name: Pipeline macro BCRD (BCRD + Yahoo + FRED + WB)
        working-directory: dashboard-min
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRED_API_KEY:         ${{ secrets.FRED_API_KEY }}
        run: python -m pipelines.macro_bcrd.run

      - name: Regenerar Excel con charts nativos
        working-directory: dashboard-min
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/build_dashboard_excel.py

      - name: Commit Excel actualizado → Vercel auto-deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard-web/public/dashboard_completo.xlsx
          if git diff --staged --quiet; then
            echo "Sin cambios en el Excel — skip commit"
          else
            git commit -m "chore(data): refresh Excel $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Trigger Vercel redeploy (fallback si no hay cambios commit)
        if: ${{ env.VERCEL_DEPLOY_HOOK != '' }}
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsSL -X POST "$VERCEL_DEPLOY_HOOK" || echo "deploy hook opcional"

      - name: Subir Excel respaldo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variables_dashboard
          path: dashboard-min/data/excel_output/variables_dashboard.xlsx
          if-no-files-found: warn
